[project]
name = "lapis-rl"
version = "0.1.0"
description = "CUA RL scaffolding on Daytona sandboxes"
requires-python = ">=3.11"
dependencies = [
    "daytona[v0-sdk]>=2.1.0",
    "httpx>=0.27",
    "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
